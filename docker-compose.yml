services:
  node1:
    build: .
    container_name: litedb-node1
    environment:
      NODE_ID: node1
      SERVER_PORT: 8080
      GRPC_PORT: 9090
    ports:
      - "8081:8080"

  node2:
    build: .
    container_name: litedb-node2
    environment:
      NODE_ID: node2
      SERVER_PORT: 8080
      GRPC_PORT: 9090
    ports:
      - "8082:8080"

  node3:
    build: .
    container_name: litedb-node3
    environment:
      NODE_ID: node3
      SERVER_PORT: 8080
      GRPC_PORT: 9090
    ports:
      - "8083:8080"