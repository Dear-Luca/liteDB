syntax = "proto3";

option java_package = "me.dearluca.liteDB.grpc";
option java_multiple_files = true;

service NodeService {
  rpc ReplicatePut(PutRequest) returns (PutResponse);
  rpc GetValue(GetValueRequest) returns (GetValueResponse);
  rpc ReplicateDelete(DeleteKeyRequest) returns (DeleteKeyResponse);
  rpc HeartBeat(HeartBeatRequest) returns (HeartBeatResponse);
}

message PutRequest {
  string key = 1;
  string value = 2;
  int64 timestamp = 3;
}

message PutResponse {
  bool success = 1;
  string message = 2;
}

message GetValueRequest {
  string key = 1;
}

message GetValueResponse {
  bool success = 1;
  string value = 2;
  int64 timestamp = 3;
  string message = 4;
}

message DeleteKeyRequest {
  string key = 1;
}

message DeleteKeyResponse {
  bool success = 1;
  int64 timestamp = 2;
  string message = 3;
}

message HeartBeatRequest {
  string nodeId = 1;
}

message HeartBeatResponse {
  bool isAlive = 1;
}